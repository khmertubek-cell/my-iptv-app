<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cambodia TV Player</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        min-height: 100vh;
    }

    /* HEADER */
    header {
        height: 65px;
        background: #111827;
        border-bottom: 1px solid #263244;
        display: flex;
        align-items: center;
        padding: 0 25px;
        gap: 20px;
    }

    .brand {
        font-size: 22px;
        font-weight: bold;
        white-space: nowrap;
    }

    .brand span {
        color: #e53935;
    }

    .search {
        flex: 1;
        max-width: 500px;
    }

    .search input {
        width: 100%;
        padding: 11px 16px;
        border: 1px solid #344154;
        border-radius: 8px;
        background: #1a2433;
        color: white;
        outline: none;
    }

    .upload-btn {
        background: #e53935;
        padding: 10px 16px;
        border-radius: 7px;
        cursor: pointer;
        font-size: 14px;
    }

    #fileInput {
        display: none;
    }

    /* LAYOUT */
    .app {
        display: flex;
        min-height: calc(100vh - 65px);
    }

    /* SIDEBAR */
    aside {
        width: 220px;
        background: #111827;
        padding: 20px 12px;
        border-right: 1px solid #263244;
    }

    .menu-title {
        color: #8b9bb0;
        font-size: 12px;
        text-transform: uppercase;
        margin: 5px 10px 12px;
    }

    .category {
        width: 100%;
        border: none;
        background: transparent;
        color: #d6dce5;
        text-align: left;
        padding: 12px;
        margin-bottom: 4px;
        border-radius: 7px;
        cursor: pointer;
        font-size: 14px;
    }

    .category:hover,
    .category.active {
        background: #253044;
        color: white;
    }

    /* MAIN CONTENT */
    main {
        flex: 1;
        padding: 25px;
        overflow: auto;
    }

    .player-box {
        width: 100%;
        max-width: 1100px;
        margin: auto;
    }

    .video-wrapper {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #000;
        border-radius: 12px;
        overflow: hidden;
    }

    video {
        width: 100%;
        height: 100%;
        background: black;
    }

    .welcome {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: #a9b4c3;
        text-align: center;
    }

    .welcome h2 {
        color: white;
        margin-bottom: 10px;
    }

    .channel-title {
        margin: 18px 0 25px;
    }

    .channel-title h2 {
        font-size: 22px;
        margin-bottom: 6px;
    }

    .channel-title p {
        color: #94a3b8;
    }

    /* CHANNEL GRID */
    .section-title {
        font-size: 20px;
        margin-bottom: 15px;
    }

    .channel-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 15px;
    }

    .channel-card {
        background: #172131;
        border: 1px solid #263244;
        border-radius: 10px;
        overflow: hidden;
        cursor: pointer;
        transition: 0.2s;
    }

    .channel-card:hover {
        transform: translateY(-3px);
        border-color: #e53935;
    }

    .channel-logo-box {
        height: 100px;
        background: #202c3d;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .channel-logo {
        width: 75px;
        height: 75px;
        object-fit: contain;
    }

    .channel-details {
        padding: 12px;
    }

    .channel-name {
        font-size: 15px;
        font-weight: bold;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .channel-group {
        color: #94a3b8;
        font-size: 12px;
        margin-top: 6px;
    }

    .favorite {
        float: right;
        background: transparent;
        border: none;
        color: #94a3b8;
        font-size: 18px;
        cursor: pointer;
    }

    .favorite.active {
        color: #f5b301;
    }

    .empty {
        padding: 50px;
        text-align: center;
        color: #94a3b8;
        background: #172131;
        border-radius: 10px;
    }

    /* MOBILE */
    @media (max-width: 700px) {

        header {
            padding: 0 12px;
        }

        .brand {
            font-size: 17px;
        }

        .upload-btn {
            padding: 9px 10px;
            font-size: 12px;
        }

        .app {
            flex-direction: column;
        }

        aside {
            width: 100%;
            display: flex;
            overflow-x: auto;
            padding: 10px;
        }

        .menu-title {
            display: none;
        }

        .category {
            width: auto;
            white-space: nowrap;
            margin-right: 5px;
        }

        main {
            padding: 15px;
        }

        .channel-grid {
            grid-template-columns: repeat(2, 1fr);
        }
    }
</style>
</head>

<body>

<header>
    <div class="brand">
        Cambodia <span>TV</span>
    </div>

    <div class="search">
        <input
            type="text"
            id="searchInput"
            placeholder="Search channels..."
            oninput="renderChannels()"
        >
    </div>

    <label class="upload-btn" for="fileInput">
        Upload M3U
    </label>

    <input
        type="file"
        id="fileInput"
        accept=".m3u,.m3u8,.txt"
    >
</header>


<div class="app">

    <aside>

        <div class="menu-title">
            Categories
        </div>

        <button
            class="category active"
            onclick="selectCategory('All', this)"
        >
            📺 All Channels
        </button>

        <button
            class="category"
            onclick="showFavorites(this)"
        >
            ⭐ Favorites
        </button>

        <div id="categoryMenu"></div>

    </aside>


    <main>

        <div class="player-box">

            <div class="video-wrapper">

                <video
                    id="player"
                    controls
                    playsinline
                ></video>

                <div
                    class="welcome"
                    id="welcome"
                >
                    <h2>Welcome to Cambodia TV</h2>
                    <p>
                        Upload your authorized M3U playlist
                        and select a channel to start watching.
                    </p>
                </div>

            </div>


            <div class="channel-title">

                <h2 id="nowPlaying">
                    No Channel Selected
                </h2>

                <p id="nowGroup">
                    Your authorized channels will appear below.
                </p>

            </div>

        </div>


        <h2 class="section-title">
            Channels
            (<span id="channelCount">0</span>)
        </h2>


        <div
            class="channel-grid"
            id="channelGrid"
        >

            <div class="empty">
                No playlist loaded yet.<br><br>
                Click <b>Upload M3U</b> to add your
                authorized playlist.
            </div>

        </div>

    </main>

</div>


<script>

let channels = [];
let selectedCategory = "All";

let favorites =
    JSON.parse(
        localStorage.getItem("tvFavorites")
    ) || [];


/* UPLOAD M3U */

document
    .getElementById("fileInput")
    .addEventListener("change", function(event) {

        const file = event.target.files[0];

        if (!file) return;

        const reader = new FileReader();

        reader.onload = function(e) {

            parseM3U(e.target.result);

        };

        reader.readAsText(file);

    });


/* PARSE PLAYLIST */

function parseM3U(text) {

    channels = [];

    const lines =
        text.split(/\r?\n/);

    let current = null;


    lines.forEach(line => {

        line = line.trim();

        if (!line) return;


        if (line.startsWith("#EXTINF")) {

            const nameMatch =
                line.match(/,(.*)$/);

            const logoMatch =
                line.match(
                    /tvg-logo="([^"]*)"/
                );

            const groupMatch =
                line.match(
                    /group-title="([^"]*)"/
                );


            current = {

                name:
                    nameMatch
                        ? nameMatch[1].trim()
                        : "Unknown Channel",

                logo:
                    logoMatch
                        ? logoMatch[1]
                        : "",

                group:
                    groupMatch
                        ? groupMatch[1]
                        : "Other",

                url: ""

            };

        }

        else if (
            current &&
            !line.startsWith("#")
        ) {

            current.url = line;

            channels.push(current);

            current = null;

        }

    });


    selectedCategory = "All";

    buildCategories();

    renderChannels();

}


/* CREATE CATEGORY BUTTONS */

function buildCategories() {

    const menu =
        document.getElementById(
            "categoryMenu"
        );

    menu.innerHTML = "";


    const groups =
        [...new Set(
            channels.map(
                channel => channel.group
            )
        )].sort();


    groups.forEach(group => {

        const button =
            document.createElement(
                "button"
            );

        button.className =
            "category";

        button.textContent =
            "📁 " + group;


        button.onclick =
            function() {

                selectCategory(
                    group,
                    button
                );

            };


        menu.appendChild(button);

    });

}


/* SELECT CATEGORY */

function selectCategory(
    category,
    button
) {

    selectedCategory = category;


    document
        .querySelectorAll(".category")
        .forEach(item => {

            item.classList.remove(
                "active"
            );

        });


    button.classList.add(
        "active"
    );


    renderChannels();

}


/* FAVORITES */

function showFavorites(button) {

    selectedCategory =
        "Favorites";


    document
        .querySelectorAll(".category")
        .forEach(item => {

            item.classList.remove(
                "active"
            );

        });


    button.classList.add(
        "active"
    );


    renderChannels();

}


function toggleFavorite(
    name,
    event
) {

    event.stopPropagation();


    if (
        favorites.includes(name)
    ) {

        favorites =
            favorites.filter(
                item => item !== name
            );

    }

    else {

        favorites.push(name);

    }


    localStorage.setItem(
        "tvFavorites",
        JSON.stringify(favorites)
    );


    renderChannels();

}


/* RENDER CHANNELS */

function renderChannels() {

    const grid =
        document.getElementById(
            "channelGrid"
        );

    const search =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .toLowerCase();


    let filtered =
        [...channels];


    if (
        selectedCategory ===
        "Favorites"
    ) {

        filtered =
            filtered.filter(
                channel =>
                    favorites.includes(
                        channel.name
                    )
            );

    }

    else if (
        selectedCategory !==
        "All"
    ) {

        filtered =
            filtered.filter(
                channel =>
                    channel.group ===
                    selectedCategory
            );

    }


    if (search) {

        filtered =
            filtered.filter(
                channel =>
                    channel.name
                        .toLowerCase()
                        .includes(search)
            );

    }


    document
        .getElementById(
            "channelCount"
        )
        .textContent =
            filtered.length;


    grid.innerHTML = "";


    if (!filtered.length) {

        grid.innerHTML = `
            <div class="empty">
                No channels found.
            </div>
        `;

        return;

    }


    filtered.forEach(channel => {

        const card =
            document.createElement(
                "div"
            );

        card.className =
            "channel-card";


        const isFavorite =
            favorites.includes(
                channel.name
            );


        const logo =
            channel.logo ||
            createLogo(channel.name);


        card.innerHTML = `

            <div class="channel-logo-box">

                <img
                    class="channel-logo"
                    src="${logo}"
                    alt=""
                    onerror="
                        this.src=createFallback(this)
                    "
                >

            </div>


            <div class="channel-details">

                <button
                    class="favorite ${
                        isFavorite
                            ? "active"
                            : ""
                    }"
                    title="Favorite"
                >
                    ${isFavorite ? "★" : "☆"}
                </button>


                <div class="channel-name">
                    ${escapeHTML(
                        channel.name
                    )}
                </div>


                <div class="channel-group">
                    ${escapeHTML(
                        channel.group
                    )}
                </div>

            </div>

        `;


        card.onclick =
            function() {

                playChannel(channel);

            };


        const favoriteButton =
            card.querySelector(
                ".favorite"
            );


        favoriteButton.onclick =
            function(event) {

                toggleFavorite(
                    channel.name,
                    event
                );

            };


        grid.appendChild(card);

    });

}


/* PLAY CHANNEL */

function playChannel(channel) {

    const player =
        document.getElementById(
            "player"
        );


    document
        .getElementById(
            "welcome"
        )
        .style.display =
            "none";


    player.src =
        channel.url;


    player.load();


    player.play()
        .catch(error => {

            console.log(
                "The browser could not automatically play this stream.",
                error
            );

        });


    document
        .getElementById(
            "nowPlaying"
        )
        .textContent =
            channel.name;


    document
        .getElementById(
            "nowGroup"
        )
        .textContent =
            "Category: " +
            channel.group;

}


/* CREATE DEFAULT CHANNEL LOGO */

function createLogo(name) {

    const letter =
        name.charAt(0)
            .toUpperCase();


    const svg = `

        <svg
            xmlns="http://www.w3.org/2000/svg"
            width="100"
            height="100"
        >

            <rect
                width="100%"
                height="100%"
                fill="#253044"
            />

            <text
                x="50%"
                y="58%"
                text-anchor="middle"
                font-family="Arial"
                font-size="45"
                fill="white"
            >
                ${letter}
            </text>

        </svg>

    `;


    return
        "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(svg);

}


/* ESCAPE HTML */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}

</script>

</body>
</html>
