<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My IPTV Player</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #101114;
    color: white;
    height: 100vh;
    overflow: hidden;
}

/* APP */
.app {
    display: flex;
    height: 100vh;
}

/* SIDEBAR */
.sidebar {
    width: 260px;
    background: #18191d;
    padding: 20px;
    border-right: 1px solid #292a30;
    overflow-y: auto;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    color: #ffffff;
    margin-bottom: 25px;
}

.logo span {
    color: #00b894;
}

.menu-title {
    color: #888;
    font-size: 12px;
    margin-bottom: 10px;
    text-transform: uppercase;
}

.category {
    width: 100%;
    padding: 12px;
    border: none;
    background: transparent;
    color: #ddd;
    text-align: left;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 5px;
    font-size: 15px;
}

.category:hover,
.category.active {
    background: #00a884;
    color: white;
}

/* MAIN */
.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* TOP BAR */
.topbar {
    min-height: 70px;
    background: #18191d;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    border-bottom: 1px solid #292a30;
}

.search-box {
    flex: 1;
}

.search-box input {
    width: 100%;
    background: #25262b;
    color: white;
    border: none;
    padding: 12px 15px;
    border-radius: 8px;
    outline: none;
}

.topbar button,
.upload-label {
    background: #00a884;
    color: white;
    border: none;
    padding: 11px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    white-space: nowrap;
}

.topbar button:hover,
.upload-label:hover {
    background: #008f71;
}

#importFile {
    display: none;
}

/* CONTENT */
.content {
    display: flex;
    flex: 1;
    overflow: hidden;
}

/* PLAYER AREA */
.player-area {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
}

.video-container {
    width: 100%;
    background: black;
    border-radius: 12px;
    overflow: hidden;
    aspect-ratio: 16 / 9;
    display: flex;
    align-items: center;
    justify-content: center;
}

video {
    width: 100%;
    height: 100%;
    background: black;
}

.empty-player {
    text-align: center;
    color: #888;
}

.channel-info {
    margin-top: 15px;
}

.channel-info h2 {
    font-size: 20px;
    margin-bottom: 5px;
}

.channel-info p {
    color: #999;
}

/* CHANNEL LIST */
.channels-panel {
    width: 350px;
    background: #18191d;
    border-left: 1px solid #292a30;
    overflow-y: auto;
}

.channels-header {
    padding: 18px;
    font-size: 18px;
    font-weight: bold;
    border-bottom: 1px solid #292a30;
}

.channel {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    cursor: pointer;
    border-bottom: 1px solid #24252a;
}

.channel:hover,
.channel.selected {
    background: #25262b;
}

.channel-logo {
    width: 50px;
    height: 50px;
    background: #303136;
    border-radius: 8px;
    object-fit: contain;
}

.channel-name {
    font-size: 15px;
    font-weight: bold;
}

.channel-group {
    font-size: 12px;
    color: #999;
    margin-top: 5px;
}

/* EMPTY MESSAGE */
.message {
    padding: 30px 20px;
    text-align: center;
    color: #888;
}

/* MOBILE */
@media (max-width: 800px) {

    body {
        overflow: auto;
    }

    .app {
        flex-direction: column;
        height: auto;
        min-height: 100vh;
    }

    .sidebar {
        width: 100%;
        height: auto;
        display: flex;
        gap: 8px;
        padding: 12px;
        overflow-x: auto;
        overflow-y: hidden;
    }

    .logo,
    .menu-title {
        display: none;
    }

    .category {
        width: auto;
        white-space: nowrap;
        margin: 0;
    }

    .topbar {
        flex-wrap: wrap;
    }

    .content {
        flex-direction: column;
        overflow: visible;
    }

    .player-area {
        flex: none;
        padding: 12px;
    }

    .channels-panel {
        width: 100%;
        border-left: none;
        border-top: 1px solid #292a30;
        max-height: 500px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">
            My<span>IPTV</span>
        </div>

        <div class="menu-title">Categories</div>

        <button class="category active" onclick="filterCategory('All', this)">
            All Channels
        </button>

        <div id="categoryList"></div>

    </aside>


    <!-- MAIN -->
    <main class="main">

        <!-- TOP BAR -->
        <div class="topbar">

            <div class="search-box">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search channels..."
                    oninput="searchChannels()"
                >
            </div>

            <label class="upload-label" for="importFile">
                Upload M3U
            </label>

            <input
                type="file"
                id="importFile"
                accept=".m3u,.m3u8,.txt"
            >

            <button onclick="loadM3UUrl()">
                M3U URL
            </button>

        </div>


        <!-- CONTENT -->
        <div class="content">

            <!-- VIDEO PLAYER -->
            <section class="player-area">

                <div class="video-container">

                    <video
                        id="videoPlayer"
                        controls
                        autoplay
                    ></video>

                    <div
                        class="empty-player"
                        id="emptyPlayer"
                    >
                        <h2>Welcome to My IPTV Player</h2>
                        <p>Upload your authorized M3U playlist to begin.</p>
                    </div>

                </div>

                <div class="channel-info">
                    <h2 id="currentChannel">
                        No Channel Selected
                    </h2>

                    <p id="currentGroup">
                        Select a channel from the list
                    </p>
                </div>

            </section>


            <!-- CHANNEL LIST -->
            <aside class="channels-panel">

                <div class="channels-header">
                    Channels
                    (<span id="channelCount">0</span>)
                </div>

                <div id="channelList">
                    <div class="message">
                        No playlist loaded.<br><br>
                        Upload an authorized M3U file.
                    </div>
                </div>

            </aside>

        </div>

    </main>

</div>


<script>

/*
    MY IPTV PLAYER
    For personal and authorized playlists only.
*/

let channels = [];
let currentCategory = "All";


/* FILE UPLOAD */

document
    .getElementById("importFile")
    .addEventListener("change", function(event) {

        const file = event.target.files[0];

        if (!file) return;

        const reader = new FileReader();

        reader.onload = function(e) {
            parseM3U(e.target.result);
        };

        reader.readAsText(file);

    });


/* LOAD M3U FROM URL */

function loadM3UUrl() {

    const url = prompt(
        "Enter an authorized M3U playlist URL:"
    );

    if (!url) return;

    fetch(url)
        .then(response => {

            if (!response.ok) {
                throw new Error(
                    "Unable to load playlist"
                );
            }

            return response.text();

        })
        .then(data => {

            parseM3U(data);

        })
        .catch(error => {

            alert(
                "Could not load this playlist URL. " +
                "The server may block browser access (CORS), " +
                "or the URL may be unavailable."
            );

            console.error(error);

        });

}


/* PARSE M3U */

function parseM3U(text) {

    channels = [];

    const lines =
        text.split(/\r?\n/);

    let currentChannel = null;

    for (let i = 0; i < lines.length; i++) {

        const line =
            lines[i].trim();

        if (!line) continue;


        /* CHANNEL INFORMATION */

        if (
            line.startsWith("#EXTINF")
        ) {

            const nameMatch =
                line.match(/,(.*)$/);

            const logoMatch =
                line.match(
                    /tvg-logo="([^"]*)"/
                );

            const groupMatch =
                line.match(
                    /group-title="([^"]*)"/
                );

            currentChannel = {

                name:
                    nameMatch
                        ? nameMatch[1].trim()
                        : "Unknown Channel",

                logo:
                    logoMatch
                        ? logoMatch[1]
                        : "",

                group:
                    groupMatch
                        ? groupMatch[1]
                        : "Other",

                url: ""

            };

        }

        /* STREAM URL */

        else if (
            currentChannel &&
            !line.startsWith("#")
        ) {

            currentChannel.url = line;

            channels.push(
                currentChannel
            );

            currentChannel = null;

        }

    }


    currentCategory = "All";

    buildCategories();

    displayChannels(channels);

}


/* BUILD CATEGORY MENU */

function buildCategories() {

    const categoryList =
        document.getElementById(
            "categoryList"
        );

    categoryList.innerHTML = "";

    const groups = [
        ...new Set(
            channels.map(
                channel => channel.group
            )
        )
    ];

    groups
        .sort()
        .forEach(group => {

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "category";

            button.textContent =
                group;

            button.onclick =
                function() {

                    filterCategory(
                        group,
                        button
                    );

                };

            categoryList.appendChild(
                button
            );

        });

}


/* FILTER CATEGORY */

function filterCategory(
    category,
    button
) {

    currentCategory = category;


    document
        .querySelectorAll(
            ".category"
        )
        .forEach(item => {

            item.classList.remove(
                "active"
            );

        });


    if (button) {

        button.classList.add(
            "active"
        );

    }


    const search =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .toLowerCase();


    let filtered =
        category === "All"
            ? channels
            : channels.filter(
                channel =>
                    channel.group === category
            );


    if (search) {

        filtered =
            filtered.filter(
                channel =>
                    channel.name
                        .toLowerCase()
                        .includes(search)
            );

    }


    displayChannels(filtered);

}


/* SEARCH */

function searchChannels() {

    const search =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .toLowerCase();


    let filtered =
        currentCategory === "All"
            ? channels
            : channels.filter(
                channel =>
                    channel.group ===
                    currentCategory
            );


    if (search) {

        filtered =
            filtered.filter(
                channel =>
                    channel.name
                        .toLowerCase()
                        .includes(search)
            );

    }


    displayChannels(filtered);

}


/* DISPLAY CHANNELS */

function displayChannels(list) {

    const channelList =
        document.getElementById(
            "channelList"
        );

    const channelCount =
        document.getElementById(
            "channelCount"
        );


    channelCount.textContent =
        list.length;


    channelList.innerHTML = "";


    if (list.length === 0) {

        channelList.innerHTML = `
            <div class="message">
                No channels found.
            </div>
        `;

        return;

    }


    list.forEach(channel => {

        const item =
            document.createElement(
                "div"
            );

        item.className =
            "channel";


        const logo =
            channel.logo
                ? channel.logo
                : createLogo(
                    channel.name
                );


        item.innerHTML = `

            <img
                class="channel-logo"
                src="${logo}"
                alt=""
                onerror="
                    this.style.display='none'
                "
            >

            <div>

                <div class="channel-name">
                    ${escapeHTML(
                        channel.name
                    )}
                </div>

                <div class="channel-group">
                    ${escapeHTML(
                        channel.group
                    )}
                </div>

            </div>

        `;


        item.onclick =
            function() {

                playChannel(
                    channel,
                    item
                );

            };


        channelList.appendChild(
            item
        );

    });

}


/* PLAY CHANNEL */

function playChannel(
    channel,
    element
) {

    const player =
        document.getElementById(
            "videoPlayer"
        );

    const empty =
        document.getElementById(
            "emptyPlayer"
        );


    empty.style.display =
        "none";


    player.style.display =
        "block";


    player.src =
        channel.url;


    player.play()
        .catch(error => {

            console.log(
                "Autoplay was blocked or the stream needs a supported format.",
                error
            );

        });


    document
        .getElementById(
            "currentChannel"
        )
        .textContent =
            channel.name;


    document
        .getElementById(
            "currentGroup"
        )
        .textContent =
            channel.group;


    document
        .querySelectorAll(
            ".channel"
        )
        .forEach(item => {

            item.classList.remove(
                "selected"
            );

        });


    element.classList.add(
        "selected"
    );

}


/* CREATE SIMPLE LOGO */

function createLogo(name) {

    const letter =
        name.charAt(0)
            .toUpperCase();

    const svg = `
        <svg
            xmlns="http://www.w3.org/2000/svg"
            width="100"
            height="100"
        >
            <rect
                width="100%"
                height="100%"
                fill="#303136"
            />
            <text
                x="50%"
                y="55%"
                text-anchor="middle"
                font-size="45"
                fill="white"
                font-family="Arial"
            >
                ${letter}
            </text>
        </svg>
    `;

    return
        "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(svg);

}


/* ESCAPE HTML */

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent = text;

    return div.innerHTML;

}

</script>

</body>
</html>
